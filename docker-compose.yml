services:
  personal-site:
    build:
      context: .
    command: sh -c "yarn build && yarn start"
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      NUXT_BUILD_DIR: /tmp/personal-site-nuxt-preview
    volumes:
      - .:/app
      - personal-site-node-modules:/app/node_modules

volumes:
  personal-site-node-modules:
